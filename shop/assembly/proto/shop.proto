syntax = "proto3";

// =====================================================================
// SwarmTales Shop — interface definition
//
// The Shop sells memberships and Ink packs, collects the story open fee
// for the Stories contract, and runs promo-code Ink grants.
//
// Payments are stablecoins only. The admin turns each token on and sets
// every price in that token's own base units (its decimals). Nothing
// here is hard-wired to a mainnet address, so a testnet token works.
// After the Shop's first sale, a newly enabled token can't be used for 7
// days, and it is announced with a public event, so buyers and the site can
// check it first (C1-01). Tokens set up before any sale work at once, since
// no buyer is exposed yet. Turning a token off works at once.
//
// Every payment is split in the same transaction:
//   founder_amount = floor(price * fee_bps / 10000)
//   treasury gets the rest
// fee_bps starts at 100 (1%) and can never be set above 500 (5%).
// The Shop never holds a balance and has no withdraw function.
// =====================================================================

package shop;

import "koinos/options.proto";

// ---------- Shared wrappers ----------

message str {
  string value = 1;
}

message uint32 {
  uint32 value = 1;
}

message uint64 {
  uint64 value = 1 [jstype = JS_STRING];
}

message boole {
  bool value = 1;
}

message empty_object {}

// ---------- Catalog ----------

enum tier {
  TIER_NONE = 0;
  TIER_READER = 1;
  TIER_WRITER = 2;
}

enum item {
  ITEM_UNSPECIFIED = 0;
  ITEM_READER_MONTH = 1;
  ITEM_WRITER_MONTH = 2;
  ITEM_PACK_S = 3;
  ITEM_PACK_M = 4;
  ITEM_PACK_L = 5;
  ITEM_OPEN_BOOK = 6;
  ITEM_OPEN_SHORT = 7;
  reserved 8, 9;                 // were the close fees (closing is free)
}

enum story_kind {
  KIND_UNSPECIFIED = 0;
  KIND_BOOK = 1;
  KIND_SHORT = 2;
}

// Why Shop asks Ink to mint. These numbers MUST match ink.mint_reason.
// Shop is only allowed PURCHASE, MEMBERSHIP, STARTER and PROMO.
enum ink_mint_reason {
  INK_MINT_UNSPECIFIED = 0;
  INK_MINT_PURCHASE = 1;
  INK_MINT_MEMBERSHIP = 2;
  INK_MINT_STARTER = 3;
  INK_MINT_PROMO = 4;
}

// ---------- Stored records ----------

message config {
  bytes admin = 1 [(koinos.btype) = ADDRESS];
  bool paused = 2;
  bytes treasury = 3 [(koinos.btype) = ADDRESS];
  bytes founder = 4 [(koinos.btype) = ADDRESS];
  bytes ink = 5 [(koinos.btype) = ADDRESS];
  bytes stories = 6 [(koinos.btype) = ADDRESS];
  uint32 fee_bps = 7;
  bool promo_enabled = 8;
  uint64 next_campaign_id = 9 [jstype = JS_STRING];
  uint64 writer_ink = 10 [jstype = JS_STRING];
  uint64 pack_s_ink = 11 [jstype = JS_STRING];
  uint64 pack_m_ink = 12 [jstype = JS_STRING];
  uint64 pack_l_ink = 13 [jstype = JS_STRING];
  uint64 starter_book = 14 [jstype = JS_STRING];
  uint64 starter_short = 15 [jstype = JS_STRING];
  bytes pending_admin = 16 [(koinos.btype) = ADDRESS];  // proposed by set_admin, waiting for accept_admin
  bool sold = 17;                // the Shop has taken a payment; from then on a newly enabled token waits 7 days (C1-01)
}

message asset {
  bool enabled = 1;
  uint32 decimals = 2;
  string symbol = 3;
  // When an enabled token may first be used (seconds). Enabling a token
  // after the Shop's first sale sets it 7 days ahead (C1-01).
  uint64 usable_from = 4 [jstype = JS_STRING];
}

message membership {
  tier tier = 1;
  uint64 paid_until = 2 [jstype = JS_STRING];
  uint64 months_unclaimed = 3 [jstype = JS_STRING];
  uint64 next_claim_at = 4 [jstype = JS_STRING];
  // Locked when the Writer term starts. Later catalog edits do not
  // change Ink already paid for. A new term, after this one ends, uses
  // the catalog amount at that purchase.
  uint64 ink_per_month = 5 [jstype = JS_STRING];
  // Seconds of Reader membership that were left when a Writer term began
  // (bought or gifted). They resume as Reader time when the Writer term
  // ends, so a gift never wipes Reader months (C1-03).
  uint64 reader_left = 6 [jstype = JS_STRING];
}

message campaign {
  // Public address of the shared link key. Empty for single-use campaigns,
  // whose link keys are added one by one.
  bytes link_signer = 1 [(koinos.btype) = ADDRESS];
  uint64 amount = 2 [jstype = JS_STRING];
  uint64 budget_total = 3 [jstype = JS_STRING];
  uint64 budget_used = 4 [jstype = JS_STRING];
  uint64 daily_cap = 5 [jstype = JS_STRING];
  uint64 used_today = 6 [jstype = JS_STRING];
  uint64 day = 7 [jstype = JS_STRING];
  uint64 starts_at = 8 [jstype = JS_STRING];
  uint64 ends_at = 9 [jstype = JS_STRING];
  bool enabled = 10;
  bool single_use = 11;
}

// Wire-compatible with ink.mint_arguments. Shop sends this to Ink.
// The name does not end in _arguments, so it is not a Shop entry point.
message ink_mint_call {
  bytes to = 1 [(koinos.btype) = ADDRESS];
  uint64 value = 2 [jstype = JS_STRING];
  uint32 reason = 3;
  string memo = 4;
}

// ---------- Reads ----------

// @description Admin, pause flag, payment addresses, fee, promo switch and Ink amounts
// @read-only true
// @result config
message get_config_arguments {}

// @description Accepted stablecoin: enabled flag, decimals, symbol and the time it may first be used
// @read-only true
// @result asset
message get_asset_arguments {
  bytes token = 1 [(koinos.btype) = ADDRESS];
}

// @description Price of one item in one token's base units (0 = not for sale)
// @read-only true
// @result uint64
message get_price_arguments {
  item item = 1;
  bytes token = 2 [(koinos.btype) = ADDRESS];
}

// @description Membership record for an account (Reader time saved under a Writer term already resumed once that term ended)
// @read-only true
// @result membership
message get_membership_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}

// @description One promo campaign. campaign_id 0 is never a campaign.
// @read-only true
// @result campaign
message get_campaign_arguments {
  uint64 campaign_id = 1 [jstype = JS_STRING];
}

// @description The newest campaign id this wallet has claimed, or 0 if it never claimed one.
// Stories reads this for the trial-writing check.
// @read-only true
// @result uint64
message get_promo_claimed_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}

// @description Whether this wallet already claimed this campaign (each wallet may claim each campaign once).
// @read-only true
// @result boole
message get_campaign_claimed_arguments {
  uint64 campaign_id = 1 [jstype = JS_STRING];
  bytes account = 2 [(koinos.btype) = ADDRESS];
}

// @description Single-use link key status: 0 unknown, 1 waiting, 2 already claimed
// @read-only true
// @result uint32
message get_single_use_status_arguments {
  uint64 campaign_id = 1 [jstype = JS_STRING];
  bytes signer = 2 [(koinos.btype) = ADDRESS];
}

// ---------- Payments ----------

// @description Buy Reader or Writer membership for 1 to 24 months
// @read-only false
// @result empty_object
message buy_membership_arguments {
  bytes payer = 1 [(koinos.btype) = ADDRESS];
  tier tier = 2;
  uint32 months = 3;
  bytes token = 4 [(koinos.btype) = ADDRESS];
  // Optional gift: who gets the membership (and its Ink). Empty = the payer.
  bytes beneficiary = 5 [(koinos.btype) = ADDRESS];
  uint64 max_price = 6 [jstype = JS_STRING]; // the most the payer agreed to pay, in the token's base units; above it nothing is charged (AB-017)
  // Writer only: the least Ink per Writer month the payer agreed to (the amount the page showed). If the month
  // would bring less, nothing is charged (M-2). Reader: send 0.
  uint64 min_ink = 7 [jstype = JS_STRING];
}

// @description Writers claim one prepaid month of Ink. A month not claimed before the Writer term ends is forfeited.
// @read-only false
// @result empty_object
message claim_writer_ink_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}

// @description Writers buy an Ink pack
// @read-only false
// @result empty_object
message buy_pack_arguments {
  bytes payer = 1 [(koinos.btype) = ADDRESS];
  item pack = 2;
  bytes token = 3 [(koinos.btype) = ADDRESS];
  uint64 max_price = 4 [jstype = JS_STRING]; // the most the payer agreed to pay, in the token's base units; above it nothing is charged (AB-017)
  uint64 min_ink = 5 [jstype = JS_STRING];   // the least Ink the payer agreed to receive; if the pack brings less, nothing is charged (M-2)
}

// @description Stories contract collects an open fee and Shop mints starter Ink
// @read-only false
// @result empty_object
message pay_open_fee_arguments {
  bytes payer = 1 [(koinos.btype) = ADDRESS];
  story_kind kind = 2;
  bytes token = 3 [(koinos.btype) = ADDRESS];
  // Set by Stories: 0 or 1 = normal price; 2, 4, 8... when the opener
  // already has many projects open. At most 1024.
  uint32 price_multiplier = 4;
  uint64 max_price = 5 [jstype = JS_STRING]; // the most the payer agreed to pay, in the token's base units; above it nothing is charged (AB-017)
  uint64 min_ink = 6 [jstype = JS_STRING];   // the least starter Ink the opener agreed to receive (M-2)
}

// ---------- Promo ----------

// @description Turn every promo campaign on or off
// @read-only false
// @result empty_object
message set_promo_enabled_arguments {
  bool enabled = 1;
}

// @description Create a promo campaign. A shared campaign passes the PUBLIC address
// of its link key. A single-use campaign leaves it empty and adds keys afterwards.
// No secret is ever sent to the chain.
// @read-only false
// @result uint64
message create_campaign_arguments {
  bytes link_signer = 1 [(koinos.btype) = ADDRESS];
  uint64 amount = 2 [jstype = JS_STRING];
  uint64 budget_total = 3 [jstype = JS_STRING];
  uint64 daily_cap = 4 [jstype = JS_STRING];
  uint64 starts_at = 5 [jstype = JS_STRING];
  uint64 ends_at = 6 [jstype = JS_STRING];
  bool single_use = 7;
  bool enabled = 8;
}

// @description Enable or disable one campaign
// @read-only false
// @result empty_object
message set_campaign_enabled_arguments {
  uint64 campaign_id = 1 [jstype = JS_STRING];
  bool enabled = 2;
}

// @description Change a campaign's budget, daily cap or end time
// @read-only false
// @result empty_object
message set_campaign_limits_arguments {
  uint64 campaign_id = 1 [jstype = JS_STRING];
  uint64 budget_total = 2 [jstype = JS_STRING];
  uint64 daily_cap = 3 [jstype = JS_STRING];
  uint64 ends_at = 4 [jstype = JS_STRING];
}

// @description Add single-use link keys (public addresses only, max 20 per call)
// @read-only false
// @result empty_object
message add_single_use_signers_arguments {
  uint64 campaign_id = 1 [jstype = JS_STRING];
  repeated bytes signers = 2 [(koinos.btype) = ADDRESS];
}

// @description Claim promo Ink with a signed link. Each wallet may claim each campaign once.
// signature = the link key's signature over
//   sha256("swarmtales/promo/v1" || shop address || campaign id (8 bytes, big-endian) || account)
// signer = the link key's address (needed for single-use campaigns, ignored otherwise).
// @read-only false
// @result empty_object
message claim_promo_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 campaign_id = 2 [jstype = JS_STRING];
  bytes signer = 3 [(koinos.btype) = ADDRESS];
  bytes signature = 4;
}

// ---------- Admin ----------

// @description Enable or disable a stablecoin and record its decimals and symbol. After the Shop's first sale, enabling
// starts a 7-day wait before it can be used; disabling is immediate. An enabled token's decimals and symbol can't change (disable it first).
// @read-only false
// @result empty_object
message set_asset_arguments {
  bytes token = 1 [(koinos.btype) = ADDRESS];
  bool enabled = 2;
  uint32 decimals = 3;
  string symbol = 4;
}

// @description Set one item's price in one token. 0 removes it.
// @read-only false
// @result empty_object
message set_price_arguments {
  item item = 1;
  bytes token = 2 [(koinos.btype) = ADDRESS];
  uint64 amount = 3 [jstype = JS_STRING];
}

// @description Payment and partner addresses. Ink and Stories may be empty until they exist; once set, each is fixed
// for good (AB-050, C1-07). Treasury and founder stay changeable.
// @read-only false
// @result empty_object
message set_addresses_arguments {
  bytes treasury = 1 [(koinos.btype) = ADDRESS];
  bytes founder = 2 [(koinos.btype) = ADDRESS];
  bytes ink = 3 [(koinos.btype) = ADDRESS];
  bytes stories = 4 [(koinos.btype) = ADDRESS];
}

// @description Ink granted by Writer months, packs and story opens. Emits ink_amounts_event (M-2).
// @read-only false
// @result empty_object
message set_ink_amounts_arguments {
  uint64 writer_month = 1 [jstype = JS_STRING];
  uint64 pack_s = 2 [jstype = JS_STRING];
  uint64 pack_m = 3 [jstype = JS_STRING];
  uint64 pack_l = 4 [jstype = JS_STRING];
  uint64 starter_book = 5 [jstype = JS_STRING];
  uint64 starter_short = 6 [jstype = JS_STRING];
}

// @description Founder fee in basis points. 100 = 1%. Cannot exceed 500.
// @read-only false
// @result empty_object
message set_fee_bps_arguments {
  uint32 fee_bps = 1;
}

// @description Pause or unpause purchases, claims, promos and story fees
// @read-only false
// @result empty_object
message set_paused_arguments {
  bool paused = 1;
}

// @description Propose a new admin. Nothing changes until that address calls accept_admin (two steps, so a typo cannot strand admin). Proposing the current admin cancels.
// @read-only false
// @result empty_object
message set_admin_arguments {
  bytes new_admin = 1 [(koinos.btype) = ADDRESS];
}

// @description The proposed admin takes over. Must be signed by the proposed address and called directly.
// @read-only false
// @result empty_object
message accept_admin_arguments {}

// ---------- Events ----------

message payment_event {
  bytes payer = 1 [(koinos.btype) = ADDRESS];
  bytes token = 2 [(koinos.btype) = ADDRESS];
  item item = 3;
  uint64 price = 4 [jstype = JS_STRING];
  uint64 treasury_amount = 5 [jstype = JS_STRING];
  uint64 founder_amount = 6 [jstype = JS_STRING];
  bytes treasury = 7 [(koinos.btype) = ADDRESS];
  bytes founder = 8 [(koinos.btype) = ADDRESS];
  uint32 fee_bps = 9;
  uint64 ink_amount = 10 [jstype = JS_STRING];
  uint32 ink_reason = 11;
}

// Exact bytes Shop sent to another contract, so the split and the mint
// can be checked against the call itself.
message external_call_event {
  bytes contract_id = 1 [(koinos.btype) = ADDRESS];
  uint32 entry_point = 2;
  bytes payload = 3;
}

message claim_event {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 amount = 2 [jstype = JS_STRING];
  uint64 months_unclaimed = 3 [jstype = JS_STRING];
  uint64 next_claim_at = 4 [jstype = JS_STRING];
}

message promo_claim_event {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 campaign_id = 2 [jstype = JS_STRING];
  uint64 amount = 3 [jstype = JS_STRING];
  string memo = 4;
}

message paused_event {
  bool paused = 1;
}

message admin_changed_event {
  bytes old_admin = 1 [(koinos.btype) = ADDRESS];
  bytes new_admin = 2 [(koinos.btype) = ADDRESS];
}

message admin_proposed_event {
  bytes admin = 1 [(koinos.btype) = ADDRESS];
  bytes proposed = 2 [(koinos.btype) = ADDRESS];   // empty when a pending handover is cancelled
}

message promo_enabled_event {
  bool enabled = 1;
}

message campaign_event {
  uint64 campaign_id = 1 [jstype = JS_STRING];
  bool enabled = 2;
  uint64 amount = 3 [jstype = JS_STRING];
  uint64 budget_total = 4 [jstype = JS_STRING];
  uint64 daily_cap = 5 [jstype = JS_STRING];
  uint64 starts_at = 6 [jstype = JS_STRING];
  uint64 ends_at = 7 [jstype = JS_STRING];
  bool single_use = 8;
}

// A membership bought for someone else.
message membership_gift_event {
  bytes payer = 1 [(koinos.btype) = ADDRESS];
  bytes beneficiary = 2 [(koinos.btype) = ADDRESS];
  tier tier = 3;
  uint32 months = 4;
}

// Ink amounts changed (M-2): what the next Writer month, pack or story open brings.
message ink_amounts_event {
  uint64 writer_month = 1 [jstype = JS_STRING];
  uint64 pack_s = 2 [jstype = JS_STRING];
  uint64 pack_m = 3 [jstype = JS_STRING];
  uint64 pack_l = 4 [jstype = JS_STRING];
  uint64 starter_book = 5 [jstype = JS_STRING];
  uint64 starter_short = 6 [jstype = JS_STRING];
}

// A payment token was enabled or disabled (C1-01). An enabled token can be
// used from usable_from on.
message asset_event {
  bytes token = 1 [(koinos.btype) = ADDRESS];
  bool enabled = 2;
  uint32 decimals = 3;
  string symbol = 4;
  uint64 usable_from = 5 [jstype = JS_STRING];
}

// Payment and partner addresses changed.
message addresses_event {
  bytes treasury = 1 [(koinos.btype) = ADDRESS];
  bytes founder = 2 [(koinos.btype) = ADDRESS];
  bytes ink = 3 [(koinos.btype) = ADDRESS];
  bytes stories = 4 [(koinos.btype) = ADDRESS];
}
