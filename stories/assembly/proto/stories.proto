syntax = "proto3";

// =====================================================================
// SwarmTales Stories — interface definition
//
// One contract holds every Book and Short Story. Writing burns the
// writer's Ink (reason BURN_CONTRIBUTION). Editor removals and
// shortenings re-credit the ORIGINAL author through Ink mint with
// reason MINT_REFUND (the only mint reason Stories is allowed).
// Open and close fees are paid through Shop, which splits them.
//
// Ink cost of text = number of UTF-16 code units. A letter costs 1,
// most emoji cost 2, a few older emoji cost 1, skin tones and flags
// cost 4, family emoji cost 8. The website shows the exact number and
// sends it as expected_ink; the contract refuses any mismatch.
// All times are seconds.
// =====================================================================

package stories;

import "koinos/options.proto";

// ---------- Shared wrappers ----------

message str {
  string value = 1;
}

message uint32 {
  uint32 value = 1;
}

message uint64 {
  uint64 value = 1 [jstype = JS_STRING];
}

message boole {
  bool value = 1;
}

message empty_object {}

message id_list {
  repeated uint64 values = 1 [jstype = JS_STRING];
}

// ---------- Enums ----------

// Same numbers as shop.story_kind.
enum story_kind {
  KIND_UNSPECIFIED = 0;
  KIND_BOOK = 1;
  KIND_SHORT = 2;
}

enum visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PUBLIC = 1;   // in the gallery; anyone eligible may write
  VISIBILITY_UNLISTED = 2; // hidden from the gallery; anyone eligible may write
  VISIBILITY_PRIVATE = 3;  // only opener, editors and allow-listed wallets may write
}

enum story_status {
  STATUS_NONE = 0;
  STATUS_OPEN = 1;
  STATUS_LOCKED = 2;
  STATUS_EDITING = 3;
  STATUS_FINALIZED = 4;
  STATUS_ARCHIVED = 5;
}

enum segment_status {
  SEGMENT_NONE = 0;
  SEGMENT_ACTIVE = 1;
  SEGMENT_REMOVED = 2;
}

// Why a part was hidden, taken down or reported.
enum moderation_reason {
  REASON_UNSPECIFIED = 0;
  REASON_COPYRIGHT = 1;   // copied from someone else's work
  REASON_DUPLICATE = 2;   // the same text already appears on SwarmTales
  REASON_SPAM = 3;
  REASON_ILLEGAL = 4;     // unlawful or abusive content
  REASON_OTHER = 5;
}

enum moderation_action {
  ACTION_NONE = 0;
  ACTION_HIDE = 1;          // admin or moderator hides a part (reversible)
  ACTION_UNHIDE = 2;
  ACTION_TAKEDOWN = 3;      // admin removes the text for good (no refund)
  ACTION_REPORT_HIDE = 4;   // enough writer reports hid the part automatically
  ACTION_RESTORE = 5;       // the story's opener or an editor brought a hidden part back
}

enum final_mode {
  FINAL_PENDING = 0;
  FINAL_UNCHANGED = 1;
  FINAL_EDITED = 2;
  FINAL_REMOVED = 3;
}

// ---------- Stored records ----------

message config {
  bytes admin = 1 [(koinos.btype) = ADDRESS];
  bool paused = 2;
  bytes ink = 3 [(koinos.btype) = ADDRESS];
  bytes shop = 4 [(koinos.btype) = ADDRESS];
  uint32 contribution_cap = 5;   // max Ink per submission (default 10,000)
  uint32 trial_limit = 6;        // lifetime trial characters for promo wallets
  uint32 open_limit = 7;         // active projects per opener
  uint32 archive_days = 8;       // inactivity before anyone may archive
  uint32 inactivity_days = 9;    // opener inactivity before the admin may take over
  uint64 next_story_id = 10 [jstype = JS_STRING];
  uint32 next_category_id = 11;
  uint32 min_contribution = 12;  // shortest new text (default 20); the piece that fills the story is exempt
  // Moderation (October 2026)
  bytes moderator = 13 [(koinos.btype) = ADDRESS]; // automated checker: may hide and unhide parts only
  uint32 terms_version = 14;     // current Terms of Use version; every new part must send it
  bytes terms_hash = 15;         // sha256 of the published Terms of Use text
  string terms_uri = 16;         // where the Terms of Use are published
  uint32 report_threshold = 17;  // writer reports that hide a part automatically (default 3)
  uint32 strike_limit = 18;      // takedowns after which a wallet is blocked automatically (default 5)
  uint32 full_price_projects = 19; // open projects at the normal price; each one beyond doubles it (default 3)
  uint32 max_price_multiplier = 20; // the doubling stops here (default 4)
  bytes pending_admin = 21 [(koinos.btype) = ADDRESS]; // proposed by set_admin, waiting for accept_admin
}

message story {
  story_kind kind = 1;
  bytes opener = 2 [(koinos.btype) = ADDRESS];
  string title = 3;
  uint32 category_1 = 4;
  uint32 category_2 = 5;
  visibility visibility = 6;
  story_status status = 7;
  uint64 max_chars = 8 [jstype = JS_STRING];
  uint64 used_chars = 9 [jstype = JS_STRING];
  uint64 total_burned = 10 [jstype = JS_STRING];
  uint64 total_refunded = 11 [jstype = JS_STRING];
  uint64 segment_count = 12 [jstype = JS_STRING];
  uint64 chapter_count = 13 [jstype = JS_STRING];
  uint64 contributor_count = 14 [jstype = JS_STRING];
  uint32 free_chapters = 15;
  uint64 contributor_edition_min = 16 [jstype = JS_STRING];
  uint64 created_at = 17 [jstype = JS_STRING];
  uint64 last_activity_at = 18 [jstype = JS_STRING];
  uint64 opener_last_active = 19 [jstype = JS_STRING];
  uint64 locked_at = 20 [jstype = JS_STRING];
  bool admin_finalize_requested = 21;
  bool finalizer_is_admin = 22;
  bool close_fee_paid = 23;
  uint64 final_cursor = 24 [jstype = JS_STRING];
  bytes running_hash = 25;
  bool revived = 26;
  string pdf_uri = 27;
  bytes pdf_hash = 28;
  uint32 editor_count = 29;
  uint64 next_invite_id = 30 [jstype = JS_STRING];
  uint32 hidden_count = 31;      // parts hidden right now; a story cannot be finalized while this is above 0
  bool needs_new_pdf = 32;       // a part was taken down after finalizing; the admin must publish a new PDF
  // Unlisted and private stories only: Ink the opener set aside to pay for
  // everyone's writing. Returned to the opener when the story is finished
  // or archived.
  uint64 fund = 33 [jstype = JS_STRING];
  uint64 fund_added = 34 [jstype = JS_STRING];
  // "The story so far": a short summary the opener, editors and writers keep up to date.
  string summary = 35;
  bytes summary_by = 36 [(koinos.btype) = ADDRESS];
  uint64 summary_at = 37 [jstype = JS_STRING];
}

message segment {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  string text = 2;
  bytes text_hash = 3;
  uint64 original_cost = 4 [jstype = JS_STRING];
  uint64 charged = 5 [jstype = JS_STRING];
  uint64 current_cost = 6 [jstype = JS_STRING];
  segment_status status = 7;
  bool starts_chapter = 8;
  bool ai_assisted = 9;
  uint64 created_at = 10 [jstype = JS_STRING];
  bytes last_edited_by = 11 [(koinos.btype) = ADDRESS];
  uint64 last_edited_at = 12 [jstype = JS_STRING];
  final_mode final_mode = 13;
  uint64 surviving = 14 [jstype = JS_STRING];
  bool hidden = 15;              // hidden from readers, the PDF and NFTs while it is checked
  bool taken_down = 16;          // removed for good by the admin (status is also REMOVED)
  moderation_reason moderation_reason = 17;
  uint32 report_count = 18;      // reports from wallets that have written on SwarmTales
  bool rights_confirmed = 19;    // the writer confirmed they wrote it or may use it
  uint32 terms_version = 20;     // Terms of Use version the writer accepted for this part
  // 0: read in order of writing. Otherwise this part is read right after
  // part insert_after; the newest part added after the same part comes first.
  uint64 insert_after = 21 [jstype = JS_STRING];
  bool fund_paid = 22;           // paid from the story's fund; its refunds go back to the fund
  string citation = 23;          // the writer's own source note, e.g. a quoted book and author (up to 200 characters)
  string source_note = 24;       // added by the copy checker: where parts of this text also appear (does not hide it)
  bool restored = 25;            // brought back by the story's opener or an editor after being hidden
  uint32 version_count = 26;     // 0: never revised. Otherwise versions 1..version_count are kept (get_versions)
  bool hidden_by_reports = 27;   // hidden by writer reports alone, not the admin or the checker: refunded if removed (AB-012)
  reserved 28;                   // was text_by on the audit-fixes branch (never deployed)
  // Someone other than the writer changed the text (revise_part or the final
  // edit), even only by cutting words. A takedown then needs the admin to
  // name who gets the strike, or to choose no strike.
  bool edited_by_others = 29;
  // Paid changes by others (revise_part). The change price doubles with each
  // (2x, 4x, 8x...), up to 60. Free edits by the writer do not count.
  uint32 paid_changes = 30;
  // In a pool-paid part: Ink the writer paid themselves for letters they added
  // later (the pool pays only for new parts). Refunds pay this back to the
  // writer first, then the rest goes back to the pool.
  uint64 own_paid = 31 [jstype = JS_STRING];
  // Who hid the part: 0 not hidden (or hidden before this field existed),
  // 1 writer reports, 2 the moderator (the copy checker), 3 the admin. The
  // opener or an editor may restore a part hidden by reports or the checker,
  // never one the admin hid (AB-053), and only the admin unhides an admin
  // hide (AB-061). The admin may take over any other hide in place (AB-062).
  uint32 hidden_by = 32;
  // Someone other than the writer made one of its kept versions (a paid
  // change or the final edit), so a takedown never reads the versions to
  // find out (AB-059).
  bool other_version = 33;
  // Its opener or an editor restored it after the copy checker hid it: a cut
  // or removing it gives back no Ink (AB-062).
  bool refund_forfeited = 34;
  // Counted among its writer's live parts in the story (AB-066).
  bool live_counted = 35;
}

message address_list {
  repeated bytes values = 1 [(koinos.btype) = ADDRESS];
}

// One version of a part. Version 1 is the original text.
message segment_version {
  uint32 version = 1;
  bytes author = 2 [(koinos.btype) = ADDRESS];  // the part's writer
  string text = 3;
  uint64 cost = 4 [jstype = JS_STRING];
  uint64 at = 5 [jstype = JS_STRING];
  uint32 kind = 6;               // 1 original, 2 changed by someone (paid), 3 removed by someone (paid), 4 edited by its writer, 5 final edit
  bytes by = 7 [(koinos.btype) = ADDRESS];      // who made this version
  string citation = 8;           // what the changer said their words quote (paid changes only)
  bool ai_assisted = 9;          // the changer said their words are AI-assisted (paid changes only)
}

message version_list {
  repeated segment_version values = 1;
  // get_versions: the version to ask for next (from = next), or 0 when there
  // are no more. A page stops early at a size budget (AB-070).
  uint32 next = 2;
}

// A wallet's standing under the repeat-infringer policy.
message account_status {
  bool blocked = 1;
  uint32 strikes = 2;            // takedowns of this wallet's parts
}

message segment_list {
  repeated segment values = 1;
}

message segment_ref {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
}

message segment_ref_list {
  repeated segment_ref values = 1;
}

message invite {
  // Public address of the invite's link key. The private half lives only
  // in the invite link, after the #. Nothing secret is stored or sent.
  bytes link_signer = 1 [(koinos.btype) = ADDRESS];
  uint32 max_uses = 2;
  uint32 uses = 3;
  uint64 expires_at = 4 [jstype = JS_STRING];
  bool revoked = 5;
}

message category {
  string name = 1;
  bool active = 2;
}

message final_item {
  uint64 seq = 1 [jstype = JS_STRING];
  final_mode mode = 2;
  string text = 3;            // only for FINAL_EDITED
  uint64 expected_cost = 4 [jstype = JS_STRING]; // only for FINAL_EDITED
}

// ---------- Messages Stories SENDS to other contracts ----------
// Names do not end in _arguments, so they are not Stories entry points.

// Wire-compatible with ink.burn_arguments.
message ink_burn_call {
  bytes from = 1 [(koinos.btype) = ADDRESS];
  uint64 value = 2 [jstype = JS_STRING];
  uint32 reason = 3;
  string memo = 4;
}

// Wire-compatible with ink.mint_arguments.
message ink_mint_call {
  bytes to = 1 [(koinos.btype) = ADDRESS];
  uint64 value = 2 [jstype = JS_STRING];
  uint32 reason = 3;
  string memo = 4;
}

// Wire-compatible with shop.pay_open_fee_arguments / pay_close_fee_arguments.
message shop_fee_call {
  bytes payer = 1 [(koinos.btype) = ADDRESS];
  uint32 kind = 2;
  bytes token = 3 [(koinos.btype) = ADDRESS];
  uint32 price_multiplier = 4;   // open fee only: 1, 2, 4, 8...
  uint64 max_price = 5 [jstype = JS_STRING]; // the most the payer agreed to pay (AB-017)
}

// Wire-compatible with shop.get_membership_arguments / get_promo_claimed_arguments.
message shop_account_call {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}

// Wire-compatible with shop.membership (what get_membership returns).
message shop_membership {
  uint32 tier = 1;
  uint64 paid_until = 2 [jstype = JS_STRING];
  uint64 months_unclaimed = 3 [jstype = JS_STRING];
  uint64 next_claim_at = 4 [jstype = JS_STRING];
  uint64 ink_per_month = 5 [jstype = JS_STRING];
}

// ---------- Reads ----------

// @description Admin, pause flag, Ink and Shop addresses, limits and counters
// @read-only true
// @result config
message get_config_arguments {}

// @description One story. An unknown id returns an empty record (status 0).
// @read-only true
// @result story
message get_story_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
}

// @description One segment (story id + sequence number, starting at 1)
// @read-only true
// @result segment
message get_segment_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
}

// @description Up to 10 segments starting at seq `start`
// @read-only true
// @result segment_list
message get_segments_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 start = 2 [jstype = JS_STRING];
  uint32 limit = 3;
}

// @description Live Ink-backed characters of one author in one story
// @read-only true
// @result uint64
message get_contributor_total_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  bytes account = 2 [(koinos.btype) = ADDRESS];
}

// @description Surviving characters after the final edit (credits and Contributor Editions)
// @read-only true
// @result uint64
message get_surviving_total_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  bytes account = 2 [(koinos.btype) = ADDRESS];
}

// @description Whether an account is an editor of a story
// @read-only true
// @result boole
message is_editor_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  bytes account = 2 [(koinos.btype) = ADDRESS];
}

// @description Whether an account is on a story's allow-list
// @read-only true
// @result boole
message is_allowed_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  bytes account = 2 [(koinos.btype) = ADDRESS];
}

// @description One invite (only the public address of its link key is stored)
// @read-only true
// @result invite
message get_invite_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 invite_id = 2 [jstype = JS_STRING];
}

// @description Lifetime trial characters a wallet has written
// @read-only true
// @result uint64
message get_trial_used_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}

// @description Active projects (OPEN, LOCKED or EDITING) a wallet has opened
// @read-only true
// @result uint32
message get_open_count_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}

// @description One category
// @read-only true
// @result category
message get_category_arguments {
  uint32 category_id = 1;
}

// @description Story ids opened by an account (index from 0, up to 50)
// @read-only true
// @result id_list
message get_opener_stories_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 start = 2 [jstype = JS_STRING];
  uint32 limit = 3;
}

// @description Story ids ever placed in a category (index from 0, up to 50). Check each story's current categories.
// @read-only true
// @result id_list
message get_category_stories_arguments {
  uint32 category_id = 1;
  uint64 start = 2 [jstype = JS_STRING];
  uint32 limit = 3;
}

// @description Segments written by an account (index from 0, up to 50)
// @read-only true
// @result segment_ref_list
message get_author_segments_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 start = 2 [jstype = JS_STRING];
  uint32 limit = 3;
}

// @description Whether a wallet has already reported a part
// @read-only true
// @result boole
message has_reported_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  bytes account = 3 [(koinos.btype) = ADDRESS];
}

// @description Whether a wallet is blocked and how many takedowns it has
// @read-only true
// @result account_status
message get_account_status_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}

// @description Price multiplier for this wallet's next story (1 = normal; doubles per open project beyond the normal-price number)
// @read-only true
// @result uint32
message get_open_multiplier_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}

// @description Latest Terms of Use version a wallet accepted (0 if never)
// @read-only true
// @result uint32
message get_terms_accepted_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
}

// @description Exact Ink the contract would charge for this text. Fails with the reason if the text is not allowed.
// @read-only true
// @result uint64
message quote_cost_arguments {
  string text = 1;
}

// ---------- Opening and settings ----------

// @description Open a Book or Short Story. Pays the open fee through Shop (which mints starter Ink), then burns Ink for the opening text.
// @read-only false
// @result uint64
message open_story_arguments {
  bytes opener = 1 [(koinos.btype) = ADDRESS];
  story_kind kind = 2;
  string title = 3;
  uint64 max_chars = 4 [jstype = JS_STRING];
  uint32 category_1 = 5;
  uint32 category_2 = 6;
  visibility visibility = 7;
  uint32 free_chapters = 8;
  uint64 contributor_edition_min = 9 [jstype = JS_STRING];
  string opening_text = 10;
  bool ai_assisted = 11;
  uint64 expected_ink = 12 [jstype = JS_STRING];
  bytes token = 13 [(koinos.btype) = ADDRESS];
  bool rights_confirmed = 14;    // must be true: "I wrote this, or I have the right to use it"
  uint32 terms_version = 15;     // must equal the current Terms of Use version
  uint64 fund = 16 [jstype = JS_STRING]; // unlisted/private only: extra Ink set aside for everyone's writing
  string citation = 17;          // optional: what the opening part quotes (up to 200 characters)
  uint64 max_price = 18 [jstype = JS_STRING]; // the most the opener agreed to pay for opening (passed to Shop, AB-017)
}

// @description Opener changes title, categories, visibility and free chapters (send all of them)
// @read-only false
// @result empty_object
message update_story_arguments {
  bytes opener = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  string title = 3;
  uint32 category_1 = 4;
  uint32 category_2 = 5;
  visibility visibility = 6;
  uint32 free_chapters = 7;
}

// @description Opener adds or removes an editor (max 10)
// @read-only false
// @result empty_object
message set_editor_arguments {
  bytes opener = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  bytes account = 3 [(koinos.btype) = ADDRESS];
  bool allowed = 4;
}

// @description Opener or editor adds or removes wallets on the allow-list (max 20 per call)
// @read-only false
// @result empty_object
message set_allowed_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  repeated bytes accounts = 3 [(koinos.btype) = ADDRESS];
  bool allowed = 4;
}

// @description Opener creates an invite link: the PUBLIC address of a fresh link key, a use limit and an expiry
// @read-only false
// @result uint64
message create_invite_arguments {
  bytes opener = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  bytes link_signer = 3 [(koinos.btype) = ADDRESS];
  uint32 max_uses = 4;
  uint64 expires_at = 5 [jstype = JS_STRING];
}

// @description Opener revokes an invite
// @read-only false
// @result empty_object
message revoke_invite_arguments {
  bytes opener = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 invite_id = 3 [jstype = JS_STRING];
}

// @description A wallet joins a story's allow-list with a signed invite link.
// signature = the link key's signature over
//   sha256("swarmtales/invite/v1" || stories address || story id (8, BE) || invite id (8, BE) || account)
// @read-only false
// @result empty_object
message join_with_invite_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 invite_id = 3 [jstype = JS_STRING];
  bytes signature = 4;
}

// ---------- Writing and editing ----------

// @description Add text to an OPEN story. Burns exactly expected_ink from the author.
// @read-only false
// @result uint64
message contribute_arguments {
  bytes author = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  string text = 3;
  bool starts_chapter = 4;
  bool ai_assisted = 5;
  uint64 expected_ink = 6 [jstype = JS_STRING];
  bool rights_confirmed = 7;     // must be true: "I wrote this, or I have the right to use it"
  uint32 terms_version = 8;      // must equal the current Terms of Use version
  uint64 insert_after = 9 [jstype = JS_STRING]; // 0 = at the end; otherwise the part this text is read after
  // Read right after this writer's previous part in this story (keeps a
  // multi-part addition in one place). Ignores insert_after.
  bool after_my_last = 10;
  string citation = 11;          // optional: what this part quotes, e.g. "Pride and Prejudice, Jane Austen" (up to 200 characters)
}

// @description Change (or, with empty text, remove) someone else's part of an OPEN story. Price: the letters
// added plus the letters removed (at least 10), times 2, doubling with every change to that part (2x, 4x, 8x...).
// The changer always pays, never the story's pool. A writer never changes their own part this way (edit_segment).
// A cut refunds the writer only Ink they (or the pool) paid for the part and have not had back, never letters
// someone else paid for; removing it refunds all of that.
// The part stays its writer's; every version is kept, with the changer's citation and AI flag.
// @read-only false
// @result uint32
message revise_part_arguments {
  bytes writer = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 seq = 3 [jstype = JS_STRING];
  string text = 4;
  uint64 expected_ink = 5 [jstype = JS_STRING]; // max(10, added + removed) x 2^(changes so far + 1)
  bool rights_confirmed = 6;
  uint32 terms_version = 7;
  string citation = 8;
  bool ai_assisted = 9;
}

// @description A part's kept versions, oldest first, at most 5 per call and only as many as fit about 64 KB of
// text (always at least one), so a page stays under a node's read limit (empty if its text never changed or it
// was taken down). Start with from = 1 and continue from the returned next until it is 0 (AB-060, AB-070).
// @read-only true
// @result version_list
message get_versions_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  uint32 from = 3;               // first version to return (0 or 1: the original)
  uint32 count = 4;              // how many (0 or more than 5: 5)
}

// @description Every wallet other than the writer that changed a part (a paid change, the final edit or a
// citation), in the order they first did. The admin may name any of them for a takedown strike.
// @read-only true
// @result address_list
message get_changers_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
}

// @description The opener, an editor or a current writer of the story updates "the story so far" while it is
// open or in its final edit. The admin or the moderator may clear it (empty summary) at any time.
// @read-only false
// @result empty_object
message set_story_summary_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  string summary = 3;            // up to 1,500 characters
}

// @description The part's own writer edits it in an OPEN story. Rewording is free; letters beyond the part's
// current length cost the normal Ink rate (the writer pays, never the pool). Shortening is always allowed and
// refunds the removed Ink, but only Ink the writer (or the pool) paid for the part and has not had back.
// @read-only false
// @result empty_object
message edit_segment_arguments {
  bytes editor = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 seq = 3 [jstype = JS_STRING];
  string new_text = 4;
  uint64 expected_cost = 5 [jstype = JS_STRING];
  // The most Ink the writer agrees to pay for added letters (the price the page showed). The edit is
  // refused if it would cost more, e.g. because someone shortened the part since (AB-049).
  uint64 max_ink = 6 [jstype = JS_STRING];
}

// @description The part's writer removes it from an OPEN story for free (the opener or an editor may remove a hidden part).
// What the writer paid comes back to them; what the pool paid goes back to the pool.
// @read-only false
// @result empty_object
message remove_segment_arguments {
  bytes editor = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 seq = 3 [jstype = JS_STRING];
}

// @description Opener adds Ink to an unlisted or private story's fund (burned from the opener now; unused Ink comes back at the end)
// @read-only false
// @result empty_object
message top_up_fund_arguments {
  bytes opener = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 amount = 3 [jstype = JS_STRING];
}

// ---------- Moderation ----------

// @description Admin or the moderator hides or unhides a part. Works at any stage. Hidden parts
// stay on the record but are left out of the site, the PDF and NFTs, and block finalizing.
// @read-only false
// @result empty_object
message set_segment_hidden_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 seq = 3 [jstype = JS_STRING];
  bool hidden = 4;
  moderation_reason reason = 5;
  string note = 6;               // up to 200 characters, e.g. what it matched
}

// @description The part's writer, the opener or an editor sets or changes the part's source note (citation).
// @read-only false
// @result empty_object
message set_citation_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 seq = 3 [jstype = JS_STRING];
  string citation = 4;           // up to 200 characters; empty clears it
}

// @description A reader saves their place in a story (their bookmark), so it follows their wallet to any device.
// @read-only false
// @result empty_object
message set_reading_place_arguments {
  bytes reader = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 seq = 3 [jstype = JS_STRING];   // 0 clears the place
  uint32 chapter = 4;
  uint32 percent = 5;                    // 0 to 100
}

// @description A reader's saved place in one story (seq 0 if none).
// @read-only true
// @result reading_place
message get_reading_place_arguments {
  bytes reader = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
}

// @description A reader's saved places, newest story first is NOT guaranteed; index from 0, up to 50.
// @read-only true
// @result reading_place_list
message get_reading_places_arguments {
  bytes reader = 1 [(koinos.btype) = ADDRESS];
  uint64 start = 2 [jstype = JS_STRING];
  uint32 limit = 3;
}

message reading_place {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  uint32 chapter = 3;
  uint32 percent = 4;
  uint64 at = 5 [jstype = JS_STRING];    // seconds
}

message reading_place_list {
  repeated reading_place values = 1;
  uint64 total = 2 [jstype = JS_STRING]; // stories this reader ever saved a place in
}

// @description Admin or moderator (the copy checker) notes where parts of a text also appear, without hiding it.
// @read-only false
// @result empty_object
message set_source_note_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 seq = 3 [jstype = JS_STRING];
  string note = 4;               // up to 200 characters; empty clears it
}

// @description The story's opener or an editor brings back a part that was hidden (not one taken down).
// @read-only false
// @result empty_object
message restore_segment_arguments {
  bytes actor = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 seq = 3 [jstype = JS_STRING];
  string note = 4;               // optional, up to 200 characters
}

// @description Admin removes a part's text for good, at any stage. No Ink refund.
// @read-only false
// @result empty_object
message takedown_segment_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  moderation_reason reason = 3;
  string note = 4;               // up to 200 characters, e.g. a notice reference
  // The wallet to strike: the writer or any wallet that changed the part.
  // Empty strikes the writer of a part nobody else changed; a part someone
  // else changed needs a wallet here or no_strike.
  bytes strike = 5 [(koinos.btype) = ADDRESS];
  bool no_strike = 6;            // take the part down without striking anyone (leave strike empty)
}

// @description Any wallet reports a part, once per part. Reports from wallets that have written on
// SwarmTales count toward hiding it automatically.
// @read-only false
// @result empty_object
message report_segment_arguments {
  bytes reporter = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  uint64 seq = 3 [jstype = JS_STRING];
  moderation_reason reason = 4;
  string note = 5;               // up to 200 characters
}

// @description Admin publishes a new PDF after a takedown in a finalized story
// @read-only false
// @result empty_object
message replace_pdf_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
  string pdf_uri = 2;
  bytes pdf_hash = 3;
}

// ---------- Closing and the final edit ----------

// @description Opener pays the close fee through Shop and starts the final edit
// @read-only false
// @result empty_object
message close_story_arguments {
  bytes opener = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  bytes token = 3 [(koinos.btype) = ADDRESS];
}

// @description Opener turns the "admin, please finalize" request on or off
// @read-only false
// @result empty_object
message request_admin_finalize_arguments {
  bytes opener = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  bool requested = 3;
}

// @description Anyone may fold up to 50 removed segments into the final edit's
// progress. Only needed when a very long run of removed text would not fit in one call.
// @read-only false
// @result empty_object
message advance_final_cursor_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
}

// @description Admin takes over the final edit (opener asked, or opener inactive 30+ days). No fee.
// @read-only false
// @result empty_object
message admin_take_over_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
}

// @description Finalizer submits the next final-edit results, in order (max 20 items, 20,000 Ink units of text)
// @read-only false
// @result empty_object
message submit_final_batch_arguments {
  bytes finalizer = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  repeated final_item items = 3;
}

// @description Finalizer stores the PDF link and hash once every segment is processed
// @read-only false
// @result empty_object
message finalize_arguments {
  bytes finalizer = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
  string pdf_uri = 3;
  bytes pdf_hash = 4;
}

// ---------- Archive ----------

// @description Anyone archives an OPEN story with no contribution or edit for the archive period
// @read-only false
// @result empty_object
message archive_if_stale_arguments {
  uint64 story_id = 1 [jstype = JS_STRING];
}

// @description Opener revives an archived story once, for free
// @read-only false
// @result empty_object
message revive_arguments {
  bytes opener = 1 [(koinos.btype) = ADDRESS];
  uint64 story_id = 2 [jstype = JS_STRING];
}

// ---------- Admin ----------

// @description Set the Ink and Shop contract addresses. Ink can be set once and never changed; Shop can change.
// @read-only false
// @result empty_object
message set_addresses_arguments {
  bytes ink = 1 [(koinos.btype) = ADDRESS];
  bytes shop = 2 [(koinos.btype) = ADDRESS];
}

// @description Set the adjustable limits, each inside its hard-coded bounds
// @read-only false
// @result empty_object
message set_limits_arguments {
  uint32 contribution_cap = 1;
  uint32 trial_limit = 2;
  uint32 open_limit = 3;
  uint32 archive_days = 4;
  uint32 inactivity_days = 5;
  uint32 full_price_projects = 6; // 0 = keep 3
  uint32 max_price_multiplier = 7; // 0 = keep 4; 1 to 1024
}

// @description Add a category (1-32 characters). Returns its id.
// @read-only false
// @result uint32
message add_category_arguments {
  string name = 1;
}

// @description Turn a category on or off for new picks
// @read-only false
// @result empty_object
message set_category_active_arguments {
  uint32 category_id = 1;
  bool active = 2;
}

// @description Pause or unpause every Stories write except admin settings
// @read-only false
// @result empty_object
message set_paused_arguments {
  bool paused = 1;
}

// @description Set the moderator (empty turns it off) and how many writer reports hide a part (1 to 20)
// @read-only false
// @result empty_object
message set_moderation_arguments {
  bytes moderator = 1 [(koinos.btype) = ADDRESS];
  uint32 report_threshold = 2;
  uint32 strike_limit = 3;       // 1 to 20 takedowns before a wallet is blocked
}

// @description Admin blocks or unblocks a wallet from opening, writing and reporting
// @read-only false
// @result empty_object
message set_blocked_arguments {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  bool blocked = 2;
  string note = 3;               // up to 200 characters
}

// @description Publish a new Terms of Use version (must be higher than the current one)
// @read-only false
// @result empty_object
message set_terms_arguments {
  uint32 version = 1;
  bytes terms_hash = 2;          // sha256 of the Terms of Use text (32 bytes)
  string terms_uri = 3;          // where to read them, up to 200 plain characters
}

// @description Propose a new admin. Nothing changes until that address calls accept_admin (two steps, so a typo cannot strand admin). Proposing the current admin cancels.
// @read-only false
// @result empty_object
message set_admin_arguments {
  bytes new_admin = 1 [(koinos.btype) = ADDRESS];
}

// @description The proposed admin takes over. Must be signed by the proposed address and called directly.
// @read-only false
// @result empty_object
message accept_admin_arguments {}

// ---------- Events ----------

message story_opened_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  bytes opener = 2 [(koinos.btype) = ADDRESS];
  story_kind kind = 3;
  uint64 max_chars = 4 [jstype = JS_STRING];
  bytes token = 5 [(koinos.btype) = ADDRESS];
}

message story_updated_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  string title = 2;
  uint32 category_1 = 3;
  uint32 category_2 = 4;
  visibility visibility = 5;
  uint32 free_chapters = 6;
}

message status_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  story_status status = 2;
  string why = 3;  // "auto-lock", "closed", "admin-take-over", "archived", "revived", "finalized"
  bytes by = 4 [(koinos.btype) = ADDRESS];
}

message revise_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  bytes by = 3 [(koinos.btype) = ADDRESS];
  uint32 kind = 4;               // 2 changed, 3 removed
  uint32 version = 5;
  uint64 paid = 6 [jstype = JS_STRING];
  bytes replaced_author = 7 [(koinos.btype) = ADDRESS];
  uint64 refund = 8 [jstype = JS_STRING];
}

message summary_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  bytes by = 2 [(koinos.btype) = ADDRESS];
  string summary = 3;
}

message contribution_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  bytes author = 3 [(koinos.btype) = ADDRESS];
  uint64 cost = 4 [jstype = JS_STRING];
  bool starts_chapter = 5;
  bool ai_assisted = 6;
  bytes text_hash = 7;
  bool trial = 8;
  bool rights_confirmed = 9;
  uint32 terms_version = 10;
  uint64 insert_after = 11 [jstype = JS_STRING];
  bool fund_paid = 12;
}

message segment_changed_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  bytes by = 3 [(koinos.btype) = ADDRESS];
  uint64 old_cost = 4 [jstype = JS_STRING];
  uint64 new_cost = 5 [jstype = JS_STRING];
  uint64 refund = 6 [jstype = JS_STRING];
  bool removed = 7;
  bool final_pass = 8;
}

message editor_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  bytes account = 2 [(koinos.btype) = ADDRESS];
  bool allowed = 3;
}

message allowed_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  bytes account = 2 [(koinos.btype) = ADDRESS];
  bool allowed = 3;
  uint64 invite_id = 4 [jstype = JS_STRING];
}

message invite_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 invite_id = 2 [jstype = JS_STRING];
  uint32 max_uses = 3;
  uint64 expires_at = 4 [jstype = JS_STRING];
  bool revoked = 5;
}

message admin_finalize_request_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  bool requested = 2;
}

message final_batch_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 final_cursor = 2 [jstype = JS_STRING];
  bytes running_hash = 3;
}

message story_finalized_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  string pdf_uri = 2;
  bytes pdf_hash = 3;
  bytes running_hash = 4;
}

// Exact bytes Stories sent to Ink or Shop.
message external_call_event {
  bytes contract_id = 1 [(koinos.btype) = ADDRESS];
  uint32 entry_point = 2;
  bytes payload = 3;
}

message category_event {
  uint32 category_id = 1;
  string name = 2;
  bool active = 3;
}

// @description Set the shortest allowed new text (1 to 200 Ink units). Starts at 20.
// @read-only false
// @result empty_object
message set_min_contribution_arguments {
  uint32 min_contribution = 1;
}

message min_contribution_event {
  uint32 min_contribution = 1;
}

message limits_event {
  uint32 contribution_cap = 1;
  uint32 trial_limit = 2;
  uint32 open_limit = 3;
  uint32 archive_days = 4;
  uint32 inactivity_days = 5;
  uint32 full_price_projects = 6;
  uint32 max_price_multiplier = 7;
}

message addresses_event {
  bytes ink = 1 [(koinos.btype) = ADDRESS];
  bytes shop = 2 [(koinos.btype) = ADDRESS];
}

message paused_event {
  bool paused = 1;
}

message admin_changed_event {
  bytes old_admin = 1 [(koinos.btype) = ADDRESS];
  bytes new_admin = 2 [(koinos.btype) = ADDRESS];
}

message admin_proposed_event {
  bytes admin = 1 [(koinos.btype) = ADDRESS];
  bytes proposed = 2 [(koinos.btype) = ADDRESS];   // empty when a pending handover is cancelled
}

// Every hide, unhide, takedown and automatic hide, on the public record.
message moderation_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  moderation_action action = 3;
  moderation_reason reason = 4;
  bytes by = 5 [(koinos.btype) = ADDRESS];
  bytes author = 6 [(koinos.btype) = ADDRESS];
  string note = 7;
  bytes text_hash = 8;           // fingerprint of the text at the time
  bytes struck = 9 [(koinos.btype) = ADDRESS];   // takedowns: the wallet that got the strike; empty when the admin chose no strike
}

message citation_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  bytes by = 3 [(koinos.btype) = ADDRESS];
  string citation = 4;
  bool source_note = 5;          // true: the copy checker's note; false: the writer's citation
}

message report_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  uint64 seq = 2 [jstype = JS_STRING];
  bytes reporter = 3 [(koinos.btype) = ADDRESS];
  moderation_reason reason = 4;
  string note = 5;
  bool counted = 6;              // true when the reporter has written on SwarmTales
  uint32 report_count = 7;
}

message terms_event {
  uint32 version = 1;
  bytes terms_hash = 2;
  string terms_uri = 3;
}

message terms_accepted_event {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint32 version = 2;
}

message moderation_settings_event {
  bytes moderator = 1 [(koinos.btype) = ADDRESS];
  uint32 report_threshold = 2;
  uint32 strike_limit = 3;
}

message account_blocked_event {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  bool blocked = 2;
  uint32 strikes = 3;
  bytes by = 4 [(koinos.btype) = ADDRESS];
  string note = 5;               // "automatic: 3 takedowns" or the admin's note
}

// Ink moved into or out of a story's fund.
message fund_event {
  uint64 story_id = 1 [jstype = JS_STRING];
  bytes by = 2 [(koinos.btype) = ADDRESS];
  string action = 3;             // "deposit" or "returned"
  uint64 amount = 4 [jstype = JS_STRING];
  uint64 fund_after = 5 [jstype = JS_STRING];
}
