name: Pages

on:
  push:
    branches: [main]
  pull_request:
  # Hourly: rebuild the RSS feeds (web/scripts/build-feeds.mjs) with the newest parts.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the website
        working-directory: web
        # No dependency install scripts (audit M-10): this job shares the npm
        # cache with the copy checker. The ABI step is a package.json
        # pre-script (pretest/prebuild), which `npm test` and `npm run build`
        # below still run; --ignore-scripts only applies to this install.
        run: npm ci --ignore-scripts
      - name: Test the website
        working-directory: web
        run: npm test
      - name: Test the copy checker and the workflows
        run: node --test checker/__tests__/lib.test.mjs checker/__tests__/workflows.test.mjs
      - name: Build the website
        working-directory: web
        run: npm run build
      - name: Build the RSS feeds (read-only; empty feeds if the node is down)
        working-directory: web
        run: node scripts/build-feeds.mjs
      - name: Upload the site
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
