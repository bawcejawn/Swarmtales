name: Copy checker

# Checks new story parts for copied text every hour and hides
# high-confidence matches with the moderator key (which can only hide and
# unhide). Free for public repositories.
#
# Settings (repository Settings > Secrets and variables > Actions):
#   Variables:  STORIES_ADDRESS (required), RPC (optional)
#   Secrets:    MODERATOR_WIF (the moderator's private key; without it the
#               checker only reports)
#               Optional free phrase search (any or all):
#                 GOOGLE_BOOKS_KEY  searches inside books (Google Books API, free)
#                 TAVILY_API_KEY    web search (Tavily free plan, 1,000 a month)
#                 BRAVE_API_KEY     web search (Brave; now needs a card on file)
#
# Review first (default): possible matches are listed in an issue,
# "Copy checker: parts to review". Nothing is hidden automatically. To hide a
# part after looking at it: Run workflow with hide_part = story:part (e.g. 4:7).
# To undo: unhide_part. Variable CHECKER_MODE=auto lets it hide by itself.
#
# To check the search keys: Actions > Copy checker > Run workflow, and type a
# sentence from a published book in "test_phrase". Nothing is hidden in a test.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_phrase:
        description: "Only test the search keys with this phrase (leave empty for a normal run)"
        required: false
        default: ""
      hide_part:
        description: "Hide this part after reviewing it, as story:part (for example 4:7)"
        required: false
        default: ""
      unhide_part:
        description: "Unhide this part, as story:part"
        required: false
        default: ""

permissions:
  contents: read
  issues: write    # the "parts to review" list
  actions: write   # only to keep this schedule from being paused after 60 quiet days

concurrency:
  group: copy-checker
  cancel-in-progress: false

jobs:
  check:
    if: vars.STORIES_ADDRESS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci && npm run abi
      - name: Test the checker
        run: node --test checker/__tests__/lib.test.mjs
      - name: Restore progress from the last run
        uses: actions/cache/restore@v4
        with:
          path: checker-state.json
          key: copy-checker-${{ github.run_id }}
          restore-keys: copy-checker-
      - name: Check new story parts
        env:
          STORIES_ADDRESS: ${{ vars.STORIES_ADDRESS }}
          RPC: ${{ vars.RPC }}
          MODERATOR_WIF: ${{ secrets.MODERATOR_WIF }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TEST_PHRASE: ${{ inputs.test_phrase }}
          HIDE_PART: ${{ inputs.hide_part }}
          UNHIDE_PART: ${{ inputs.unhide_part }}
          CHECKER_MODE: ${{ vars.CHECKER_MODE }}
          GITHUB_TOKEN: ${{ github.token }}
          STATE_FILE: checker-state.json
        run: node checker/check.mjs
      - name: Save progress
        if: always() && hashFiles('checker-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: checker-state.json
          key: copy-checker-${{ github.run_id }}
      - name: Keep the hourly schedule switched on
        # GitHub pauses scheduled workflows in repositories with no activity
        # for 60 days. Re-enabling this workflow resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/copy-checker.yml/enable" || true
