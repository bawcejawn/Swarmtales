name: Copy checker

# Checks new story parts for copied text every hour and hides
# high-confidence matches with the moderator key (which can only hide and
# unhide). Free for public repositories.
#
# Settings (repository Settings > Secrets and variables > Actions):
#   Variables:  STORIES_ADDRESS (required), RPC (optional), EXPECTED_CHAIN_ID
#               (needed only for a node other than the Foundation testnet or api.koinos.io)
#   Secrets:    MODERATOR_WIF (the moderator's private key; without it the
#               checker only reports)
#               Optional free phrase search (any or all):
#                 GOOGLE_BOOKS_KEY  searches inside books (Google Books API, free)
#                 TAVILY_API_KEY    web search (Tavily free plan, 1,000 a month)
#                 BRAVE_API_KEY     web search (Brave; now needs a card on file)
#
# To check the search keys: Actions > Copy checker > Run workflow, and type a
# sentence from a published book in "test_phrase". Nothing is hidden in a test.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_phrase:
        description: "Only test the search keys with this phrase (leave empty for a normal run)"
        required: false
        default: ""

# Read-only by default. Only the keep-schedule job, which holds no secrets,
# gets actions: write.
permissions:
  contents: read

concurrency:
  group: copy-checker
  cancel-in-progress: false

jobs:
  check:
    if: vars.STORIES_ADDRESS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no token left in .git/config for later steps
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        # No install scripts: this job holds the moderator key and search keys.
        run: npm ci --ignore-scripts && npm run abi
      - name: Test the checker
        run: node --test checker/__tests__/lib.test.mjs checker/__tests__/workflows.test.mjs
      - name: Restore progress from the last run
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: checker-state.json
          key: copy-checker-${{ github.run_id }}
          restore-keys: copy-checker-
      - name: Check new story parts
        env:
          STORIES_ADDRESS: ${{ vars.STORIES_ADDRESS }}
          RPC: ${{ vars.RPC }}
          EXPECTED_CHAIN_ID: ${{ vars.EXPECTED_CHAIN_ID }}
          MODERATOR_WIF: ${{ secrets.MODERATOR_WIF }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TEST_PHRASE: ${{ inputs.test_phrase }}
          STATE_FILE: checker-state.json
        run: node checker/check.mjs
      - name: Save progress
        if: always() && hashFiles('checker-state.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: checker-state.json
          key: copy-checker-${{ github.run_id }}

  keep-schedule:
    # GitHub pauses scheduled workflows in repositories with no activity
    # for 60 days. Re-enabling this workflow resets that clock. A separate
    # job, so the write token never sits next to the moderator key.
    if: vars.STORIES_ADDRESS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the hourly schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/copy-checker.yml/enable" || true
